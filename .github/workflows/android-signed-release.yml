name: Android signed production release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS API origin embedded in the production APK"
        required: true
        default: "https://api.yarsalam.top"
        type: string
      source_ref:
        description: "Exact reviewed source ref to build"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_BASE_URL: ${{ inputs.api_base_url }}
      ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/yarsalam-release.keystore
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.1"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Validate private signing secrets and materialize keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_RELEASE_STORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_STORE_FILE"
          test -s "$ANDROID_RELEASE_STORE_FILE"
          chmod 600 "$ANDROID_RELEASE_STORE_FILE"
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Validate and apply API URL
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          from urllib.parse import urlsplit
          value = os.environ["API_BASE_URL"].strip()
          if not re.fullmatch(r"https://[A-Za-z0-9.-]+(?::[0-9]+)?(?:/[^\s]*)?", value):
              raise SystemExit("API_BASE_URL must be an HTTPS URL with a valid hostname.")
          parsed = urlsplit(value)
          if not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit("API_BASE_URL must not contain credentials and must have a hostname.")
          if parsed.hostname in {"localhost", "localhost.localdomain"} or parsed.hostname.endswith(".local"):
              raise SystemExit("A downloadable APK cannot use a localhost/LAN API hostname.")
          path = Path("src/config/api.ts")
          source = path.read_text()
          lines = source.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith("export const API_BASE_URL = ")]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one API_BASE_URL declaration.")
          lines[matches[0]] = "export const API_BASE_URL = " + repr(value) + ";"
          path.write_text("\n".join(lines) + "\n")
          PY
      - name: Build signed production APKs
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Verify APK signatures and prepare checksums
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/release"
          mkdir -p dist
          test -s "$OUT/app-arm64-v8a-release.apk"
          test -s "$OUT/app-armeabi-v7a-release.apk"
          cp "$OUT/app-arm64-v8a-release.apk" dist/yarsalam-arm64-v8a.apk
          cp "$OUT/app-armeabi-v7a-release.apk" dist/yarsalam-armeabi-v7a.apk
          for apk in dist/*.apk; do
            apksigner verify --verbose --print-certs "$apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
      - name: Upload signed release candidate (not publicly published)
        uses: actions/upload-artifact@v7
        with:
          name: yarsalam-signed-production-apks
          path: |
            dist/yarsalam-arm64-v8a.apk
            dist/yarsalam-armeabi-v7a.apk
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 30

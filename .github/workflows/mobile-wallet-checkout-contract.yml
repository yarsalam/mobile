name: Mobile Wallet Checkout Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "src/api/mutations/payment/useBuyWithWallet.ts"
      - "src/api/mutations/payment/useBuyWithWallet.test.ts"
      - "src/components/products/ProductCard.tsx"
      - ".github/workflows/mobile-wallet-checkout-contract.yml"

permissions:
  contents: read

jobs:
  wallet-checkout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Wallet checkout idempotency tests
        run: npm test -- --runInBand src/api/mutations/payment/useBuyWithWallet.test.ts

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: ESLint validation
        run: npm run lint

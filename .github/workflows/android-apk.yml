name: Android test APK

on:
  push:
    branches: [main, fix/mobile-wallet-checkout-idempotency-2026-11-08, fix/mobile-ai-provider-disclosure-2026-11-10]
    paths:
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/android-signed-release.yml"
      - "src/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "jest.config.js"
      - "jest.setup.js"
      - "__tests__/**"
      - "app.json"
      - "types/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/android-signed-release.yml"
      - "src/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "jest.config.js"
      - "jest.setup.js"
      - "__tests__/**"
      - "app.json"
      - "types/**"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS API origin embedded in the test APK"
        required: true
        default: "https://api.yarsalam.top"
        type: string
      release_tag:
        description: "Unique tag for an explicitly approved test prerelease"
        required: false
        default: "test-v0.1.4"
        type: string
      publish_prerelease:
        description: "Publish the test APK as a public GitHub prerelease (default off)"
        required: true
        default: false
        type: boolean
      source_ref:
        description: "Source branch to build (use main after merging this PR)"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    permissions:
      contents: write
    name: Lint, test and build standalone Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'https://api.yarsalam.top' }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.source_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages used by the project
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Reconcile package lock for native Firebase dependencies
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(mobile): sync package lock for Firebase messaging"
            git push origin "HEAD:${PR_HEAD_REF}"
          fi

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Audit mobile production dependencies
        id: mobile-audit
        shell: bash
        run: |
          mkdir -p security-report
          npm audit --omit=dev --json > security-report/npm-audit-production.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('security-report/npm-audit-production.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const summary = [
            '## Mobile production dependency audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...['critical','high','moderate','low','info'].map(k => `| ${k} | ${counts[k] ?? 0} |`),
            '',
            `Total: ${counts.total ?? 0}`
          ].join(String.fromCharCode(10));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          if ((counts.critical ?? 0) > 0 || (counts.high ?? 0) > 0) {
            console.error(`Blocking release build: ${counts.critical ?? 0} critical and ${counts.high ?? 0} high production dependency vulnerabilities remain.`);
            process.exit(1);
          }
          NODE
      - name: Upload mobile dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yarsalam-mobile-dependency-audit
          path: security-report/npm-audit-production.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Normalize mislabeled WebP images before Android resource compilation
        run: |
          python3 -m venv /tmp/image-fix-venv
          /tmp/image-fix-venv/bin/python -m pip install --disable-pip-version-check Pillow
          /tmp/image-fix-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image

          converted = []
          for path in Path("src").rglob("*.png"):
              raw = path.read_bytes()
              if raw.startswith(b"RIFF") and raw[8:12] == b"WEBP":
                  with Image.open(path) as image:
                      image.convert("RGBA" if "A" in image.getbands() else "RGB").save(path, format="PNG")
                  converted.append(str(path))
          print("Converted mislabeled WebP assets:", converted or "none")
          PY

      - name: Validate and apply API URL
        shell: bash
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          value = os.environ["API_BASE_URL"].strip()
          if not re.fullmatch(r"https://[A-Za-z0-9.-]+(?::[0-9]+)?(?:/[^\s]*)?", value):
              raise SystemExit("API_BASE_URL must be an HTTPS URL with a valid hostname.")

          parsed = urlsplit(value)
          hostname = (parsed.hostname or "").rstrip(".").lower()
          if not hostname or parsed.username or parsed.password:
              raise SystemExit("API_BASE_URL must contain a valid public API hostname.")

          if hostname in {"localhost", "localhost.localdomain"} or hostname.endswith(".local"):
              raise SystemExit("Do not use localhost or a LAN-only hostname in a downloadable APK.")

          try:
              ip_address = ipaddress.ip_address(hostname)
          except ValueError:
              ip_address = None

          if ip_address is not None:
              raise SystemExit("Use a public HTTPS DNS hostname, not an IP address. Private/LAN IPs are only reachable inside the developer's local network.")

          path = Path("src/config/api.ts")
          if not path.is_file():
              raise SystemExit("src/config/api.ts is missing on this ref; use the mobile API-contract branch.")

          source = path.read_text()
          lines = source.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith("export const API_BASE_URL = ")]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one API_BASE_URL declaration.")
          lines[matches[0]] = "export const API_BASE_URL = " + repr(value) + ";"
          path.write_text(chr(10).join(lines) + chr(10))
          PY

      - name: Lint wallet checkout changes (blocking)
        run: npx eslint src/api/mutations/payment/useBuyWithWallet.ts src/api/mutations/payment/useBuyWithWallet.test.ts src/api/queries/aiAssistant.ts src/api/queries/aiAssistant.test.ts src/api/mutations/assistant/aiAssistantHooks.ts src/components/products/ProductCard.tsx src/components/BasketScreen.tsx src/pages/payment/Basket.tsx types/rootStackParamList.ts src/pages/messages/ChatScreen.tsx src/lib/useModeratedSend.ts src/lib/moderationDecision.ts src/lib/moderationDecision.test.ts src/lib/requestReplySuggestionConsent.ts src/lib/requestReplySuggestionConsent.test.ts src/api/queries/messages.ts src/api/queries/messages.test.ts src/api/mutations/messages/useSendMessage.ts src/api/mutations/useModerationCheck.ts src/api/mutations/personality/useTextPersonality.ts src/api/mutations/personality/useTextPersonality.test.ts src/components/personality/TextPersonalityAnalysisCard.tsx src/pages/assistant/AiAdvice.tsx src/pages/AccountActionsScreen.tsx

      - name: Audit repository-wide lint baseline (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Type-check the React Native application (blocking)
        run: npx tsc --noEmit

      - name: Run wallet checkout Jest tests (blocking)
        run: npm test -- --runInBand src/api/mutations/payment/useBuyWithWallet.test.ts src/api/mutations/personality/useTextPersonality.test.ts src/api/queries/aiAssistant.test.ts src/lib/moderationDecision.test.ts src/lib/requestReplySuggestionConsent.test.ts src/api/queries/messages.test.ts

      - name: Run full Jest suite (blocking)
        run: npm test -- --runInBand --passWithNoTests

      - name: Build standalone Android test APK (bundles JavaScript)
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify standalone JavaScript bundle is packaged
        shell: bash
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/debug"
          for apk in "$OUT/app-arm64-v8a-debug.apk" "$OUT/app-armeabi-v7a-debug.apk"; do
            test -s "$apk"
            if ! unzip -Z1 "$apk" | grep -Fxq "assets/index.android.bundle"; then
              echo "::error::Standalone APK is missing assets/index.android.bundle: $apk"
              exit 1
            fi
            echo "Verified embedded JS bundle: $apk"
          done

      - name: Prepare per-ABI APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/debug"
          mkdir -p dist
          test -s "$OUT/app-arm64-v8a-debug.apk"
          test -s "$OUT/app-armeabi-v7a-debug.apk"
          cp "$OUT/app-arm64-v8a-debug.apk" dist/yarsalam-test-arm64-v8a.apk
          cp "$OUT/app-armeabi-v7a-debug.apk" dist/yarsalam-test-armeabi-v7a.apk
          cd dist
          sha256sum yarsalam-test-arm64-v8a.apk yarsalam-test-armeabi-v7a.apk > SHA256SUMS.txt
          git rev-parse HEAD > SOURCE_COMMIT.txt
          echo "Individual downloadable APK sizes:"
          du -h yarsalam-*.apk

      - name: Upload APK artifacts (14-day retention)
        uses: actions/upload-artifact@v7
        with:
          name: yarsalam-test-apks
          path: |
            dist/yarsalam-test-arm64-v8a.apk
            dist/yarsalam-test-armeabi-v7a.apk
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14

  publish-public-prerelease:
    name: Publish optional public GitHub prerelease
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease == true && inputs.release_tag != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-test-apk]'))
    needs: build-test-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'test-v0.1.4' }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "release_tag may contain only letters, numbers, dots, underscores and hyphens."
            exit 1
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: yarsalam-test-apks
          path: dist

      - name: Publish test APK as a public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'test-v0.1.4' }}
        run: |
          cat > release-notes.md <<'NOTES'
          Automated test build from GitHub Actions.

          Download yarsalam-test-arm64-v8a.apk for most modern Android phones (64-bit ARM). If it is not compatible with the device, try yarsalam-test-armeabi-v7a.apk (32-bit ARM).

          These APKs bundle JavaScript and do not require Metro. They are debug-signed test artifacts, not production release APKs. Production releases require the private owner-controlled keystore and the signed release workflow.
          NOTES
          # Each release run needs a unique tag; existing tags are not overwritten.
          gh release create "$RELEASE_TAG" \
            dist/yarsalam-test-arm64-v8a.apk \
            dist/yarsalam-test-armeabi-v7a.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(cat dist/SOURCE_COMMIT.txt)" \
            --title "Yarsalam test APK $RELEASE_TAG" \
            --notes-file release-notes.md \
            --prerelease

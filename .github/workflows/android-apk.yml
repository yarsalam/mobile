name: Android test APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS API origin embedded in the test APK"
        required: true
        default: "https://api.yarsalam.top"
        type: string
      release_tag:
        description: "Unique tag to publish a public prerelease (next available default: test-v0.1.1)"
        required: false
        default: "test-v0.1.1"
        type: string
      source_ref:
        description: "Source branch to build (use main after merging this PR)"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Lint, test and build standalone Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'https://api.yarsalam.top' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages used by the project
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Normalize mislabeled WebP images before Android resource compilation
        run: |
          python3 -m venv /tmp/image-fix-venv
          /tmp/image-fix-venv/bin/python -m pip install --disable-pip-version-check Pillow
          /tmp/image-fix-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image

          converted = []
          for path in Path("src").rglob("*.png"):
              raw = path.read_bytes()
              if raw.startswith(b"RIFF") and raw[8:12] == b"WEBP":
                  with Image.open(path) as image:
                      image.convert("RGBA" if "A" in image.getbands() else "RGB").save(path, format="PNG")
                  converted.append(str(path))
          print("Converted mislabeled WebP assets:", converted or "none")
          PY

      - name: Validate and apply API URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          value = os.environ["API_BASE_URL"].strip()
          if not re.fullmatch(r"https://[A-Za-z0-9.-]+(?::[0-9]+)?(?:/[^\s]*)?", value):
              raise SystemExit("API_BASE_URL must be an HTTPS URL with a valid hostname.")

          path = Path("src/config/api.ts")
          if not path.is_file():
              raise SystemExit("src/config/api.ts is missing on this ref; use the mobile API-contract branch.")

          source = path.read_text()
          lines = source.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith("export const API_BASE_URL = ")]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one API_BASE_URL declaration.")
          lines[matches[0]] = "export const API_BASE_URL = " + repr(value) + ";"
          path.write_text(chr(10).join(lines) + chr(10))
          PY

      - name: Lint (non-blocking for test APK)
        run: npm run lint
        continue-on-error: true

      - name: Run Jest tests (non-blocking for test APK)
        run: npm test -- --runInBand --passWithNoTests
        continue-on-error: true

      - name: Build standalone Android test APK (bundles JavaScript)
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Prepare per-ABI APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/release"
          mkdir -p dist
          test -s "$OUT/app-arm64-v8a-release.apk"
          test -s "$OUT/app-armeabi-v7a-release.apk"
          cp "$OUT/app-arm64-v8a-release.apk" dist/yarsalam-arm64-v8a.apk
          cp "$OUT/app-armeabi-v7a-release.apk" dist/yarsalam-armeabi-v7a.apk
          cd dist
          sha256sum yarsalam-arm64-v8a.apk yarsalam-armeabi-v7a.apk > SHA256SUMS.txt
          git rev-parse HEAD > SOURCE_COMMIT.txt
          echo "Individual downloadable APK sizes:"
          du -h yarsalam-*.apk

      - name: Upload APK artifacts (14-day retention)
        uses: actions/upload-artifact@v7
        with:
          name: yarsalam-test-apks
          path: |
            dist/yarsalam-arm64-v8a.apk
            dist/yarsalam-armeabi-v7a.apk
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14

  publish-public-prerelease:
    name: Publish optional public GitHub prerelease
    if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-test-apk]'))
    needs: build-test-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'test-v0.1.1' }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "release_tag may contain only letters, numbers, dots, underscores and hyphens."
            exit 1
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: yarsalam-test-apks
          path: dist

      - name: Publish test APK as a public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'test-v0.1.1' }}
        run: |
          cat > release-notes.md <<'NOTES'
          Automated test build from GitHub Actions.

          Download yarsalam-arm64-v8a.apk for most modern Android phones (64-bit ARM). If it is not compatible with the device, try yarsalam-armeabi-v7a.apk (32-bit ARM).

          These APKs bundle JavaScript and do not require Metro. They are signed with the repository debug key for testing, not a production signing key. They use the HTTPS API URL supplied to the workflow. Do not use them for a public production rollout.
          NOTES
          # Each release run needs a unique tag; existing tags are not overwritten.
          gh release create "$RELEASE_TAG" \
            dist/yarsalam-arm64-v8a.apk \
            dist/yarsalam-armeabi-v7a.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(cat dist/SOURCE_COMMIT.txt)" \
            --title "Yarsalam test APK $RELEASE_TAG" \
            --notes-file release-notes.md \
            --prerelease
